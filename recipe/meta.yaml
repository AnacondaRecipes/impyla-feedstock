{% set name = "impyla" %}
{% set version = "0.23.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0c617436cd98493139306354f5c0af75d1d7567b168be1289fdea1fdfb431777

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools <81
  run:
    - python
    - six
    - bitarray
    - thrift ==0.16.0
    - thrift_sasl ==0.4.3
  run_constrained:
    - kerberos >=1.3.0
    # ModuleNotFoundError: No module named 'pkg_resources'
    - setuptools <81

# Tests disabled conftest.py can't normally setup the environment
#   > raise TTransportException(type=TTransportException.NOT_OPEN, message=msg)
#   E thrift.transport.TTransport.TTransportException: Could not connect to any of [('::1', 21050, 0, 0), ('127.0.0.1', 21050)]
test:
  imports:
    - impala
    - impala.tests
    - impala.thrift
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip

about:
  home: https://github.com/cloudera/impyla
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: Python client for the Impala distributed query engine
  description: |
    Python DB API 2.0 client for Impala and Hive (HiveServer2 protocol)
  doc_url: https://pypi.org/project/impyla
  dev_url: https://github.com/cloudera/impyla

extra:
  recipe-maintainers:
    - mariusvniekerk
    - wesm
    - kszucs
